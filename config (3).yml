# CrossBridge universal configuration.
# The same file is understood by Spigot/Paper, BungeeCord and Velocity.
# Set the same secret on every backend and proxy.
security-enabled: true
auth-required: true
shared-secret: "CHANGE-ME-please-use-a-random-secret"
max-messages-per-second: 30
invalid-packet-threshold: 5
security-lockout-seconds: 15
heartbeat-expiry-seconds: 20
ping-interval-seconds: 15
fallback-server: lobby
debug: false
server-id: lobby
heartbeat-seconds: 5
known-servers:
  - lobby
  - survival
  - minigames
